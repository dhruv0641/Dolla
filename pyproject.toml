[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-ai-content-os"
version = "0.1.0"
description = "Self-hosted AI content production operating system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]
